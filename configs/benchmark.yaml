experiment:
  videos: 10
  # Active dataset: MSR-VTT via Kaggle (vishnutheepb/msrvtt).
  # Switched from MSVD (friedrichor/MSVD) — MSVD code preserved in benchmark_data.py.
  dataset: "vishnutheepb/msrvtt"
  seed: 42
  output_dir: "./results"
  cache_dir: "./cache"

models:
  vlm:
    name: "vikhyatk/moondream2"
    revision: "2024-08-26"          # Pin to exact HF commit — bump this when upgrading the model.
    fallback: "Salesforce/blip-image-captioning-base"
    batch_size: 4
  llm:
    name: "phi3:mini"
    host: "http://172.31.64.1:11434"
  whisper:
    name: "tiny"
    no_speech_threshold: 0.7

pipeline:
  samplers:
    - "fps1"
    - "fps2"
    - "random"
    - "phash"
    - "tass_adaptive"
  aggregators:
    - "raw"
    - "centroid"
    - "temporal"
  caption_modes:
    - "vlm_only"
    - "vlm_plus_llm"
